[project]
name = "launchpad-mkii-mapper"
version = "0.2.1"
description = "Launchpad GUI (minimal build)"
authors = [{ name = "Your Name" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "PySide6>=6.6.0",
  "mido>=1.3.0",
  "python-rtmidi>=1.5.8",
  "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "ruff>=0.5.0",
  "pytest>=8.0.0"
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
# faulthandler aborts on SEH exceptions that Qt handles internally on Windows
addopts = "-p no:faulthandler"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
