[project]
name = "launchpad-mkii-mapper"
version = "0.1.5"
description = "Launchpad GUI (minimal build)"
authors = [{ name = "Your Name" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "PySide6>=6.6.0",
  "mido>=1.3.0",
  "python-rtmidi>=1.5.8",
  "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "ruff>=0.5.0",
  "pytest>=8.0.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
